<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="left-img">
      <div class="logo">
        <img src="images/odin-lined.png" alt="Odin Logo" />
        Odin
      </div>
      <div class="credit">
        Photo by
        <a
          href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Halie West</a
        >
        on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
          >Unsplash</a
        >
      </div>
    </div>

    <main class="right-form">
      <div class="intro">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. <br> Sign up
          <em>now</em> to get started.
        </p>

        <p>You <em>know</em> you want to.</p>
      </div>

      <form action="#">
        <div class="sign-up-form">
          <h1>Let's do this!</h1>

          <div class="form-row">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="firstName" required/>
            </div>

            <div class="form-group">
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lastName" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required/>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phoneNumber" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="pwd">Password</label>
              <input type="password" id="pwd" name="password" required/>
            </div>

            <div class="form-group">
              <label for="cpwd">Confirm Password</label>
              <input type="password" id="cpwd" name="confirmPassword" required/>
            </div>
          </div>

        </div>

        <div class="form-footer">
            <button type="submit">Create Account</button>
            <p>Already have an account?<a href="#">Log in</a></p>
          </div>

      </form>
    </main>
  </body>
</html>
